<h3>Critical Security Event IDs</h3>
<p>The following event IDs are the most important for red team operators to understand. Each corresponds to specific actions that are logged by default or through Advanced Audit Policy configuration.</p>

<table class="dtable">
<tr><th>Event ID</th><th>Description</th><th>Red Team Relevance</th></tr>
<tr><td>4624</td><td>An account was successfully logged on</td><td>Logon type 2 (interactive), 3 (network), 9 (RunAs)</td></tr>
<tr><td>4625</td><td>An account failed to log on</td><td>Password spraying attempts</td></tr>
<tr><td>4634</td><td>An account was logged off</td><td>End of logon session</td></tr>
<tr><td>4648</td><td>A logon was attempted using explicit credentials</td><td>RunAs, scheduled task with credentials</td></tr>
<tr><td>4672</td><td>Special privileges assigned to new logon</td><td>SYSTEM or admin logon</td></tr>
<tr><td>4688</td><td>A new process has been created</td><td>All process execution tracking</td></tr>
<tr><td>4698</td><td>A scheduled task was created</td><td>Persistence detection</td></tr>
<tr><td>4700</td><td>A scheduled task was enabled</td><td>Task activation</td></tr>
<tr><td>4703</td><td>A user right was adjusted</td><td>Privilege usage (SeDebugPrivilege, etc.)</td></tr>
<tr><td>4719</td><td>System audit policy was changed</td><td>Log tampering detection</td></tr>
<tr><td>4720</td><td>A user account was created</td><td>Backdoor account creation</td></tr>
<tr><td>4732</td><td>A member was added to a security-enabled local group</td><td>Admin group escalation</td></tr>
<tr><td>4738</td><td>A user account was changed</td><td>Account attribute modification</td></tr>
<tr><td>5140</td><td>A network share object was accessed</td><td>Lateral movement via SMB</td></tr>
<tr><td>5156</td><td>The Windows Filtering Platform permitted a connection</td><td>Network connection monitoring</td></tr>
</table>

<div class="ab"><strong>Attack Relevance:</strong> Event ID <span class="cmd">4688</span> (Process Creation) includes command-line auditing when enabled. This logs the full command line of every executed process, including arguments, making it one of the most important detection events. C2 frameworks that pass arguments on the command line (e.g., <span class="cmd">powershell.exe -EncodedCommand &lt;base64&gt;</span>) are immediately visible. Using <span class="cmd">CmdLine</span> truncation or alternative execution methods (WMI, COM objects, services) can reduce visibility.</div>

<h3>Event ID 4624: Logon Types</h3>
<p>The LogonType field in event 4624 indicates the method of authentication. This is critical for understanding how credentials are being used in the environment:</p>

<table class="dtable">
<tr><th>Logon Type</th><th>Name</th><th>Description</th></tr>
<tr><td>2</td><td>Interactive</td><td>Local console logon (physical or RDP)</td></tr>
<tr><td>3</td><td>Network</td><td>Network authentication (SMB, NetLogon)</td></tr>
<tr><td>4</td><td>Batch</td><td>Scheduled task or batch job</td></tr>
<tr><td>5</td><td>Service</td><td>Windows service startup</td></tr>
<tr><td>7</td><td>Unlock</td><td>Workstation unlock</td></tr>
<tr><td>8</td><td>NetworkCleartext</td><td>Network with cleartext credentials (IIS)</td></tr>
<tr><td>9</td><td>NewCredentials</td><td>RunAs with different credentials</td></tr>
<tr><td>10</td><td>RemoteInteractive</td><td>Remote Desktop (RDP) logon</td></tr>
<tr><td>11</td><td>CachedInteractive</td><td>Logon with cached domain credentials</td></tr>
</table>

<h3>Sysmon (System Monitor)</h3>
<p>Sysmon is a Sysinternals tool that extends Windows logging with detailed event data. It installs as a kernel-mode driver and a Windows service, providing events that go far beyond the standard Windows Security log. Sysmon is widely deployed in enterprise environments for detection and incident response.</p>

<div class="cb"><span class="cmt"># Common Sysmon Event IDs for Red Teamers</span>
<span class="cmt"># Event 1: Process creation (more detailed than 4688)</span>
<span class="cmt">#   - Includes ProcessID, ParentProcessID, Image, CommandLine</span>
<span class="cmt">#   - Hashes (MD5, SHA1, SHA256) of the executable</span>
<span class="cmt"># Event 3: Network connection</span>
<span class="cmt">#   - Source IP/port, Destination IP/port, protocol</span>
<span class="cmt">#   - Process that initiated the connection</span>
<span class="cmt"># Event 7: Image loaded (DLL load tracking)</span>
<span class="cmt">#   - Detects DLL hijacking and side-loading</span>
<span class="cmt"># Event 8: CreateRemoteThread (cross-process injection)</span>
<span class="cmt">#   - Flags: SourceProcessID, TargetProcessID</span>
<span class="cmt">#   - High-fidelity detection of process injection</span>
<span class="cmt"># Event 10: Process access (OpenProcess)</span>
<span class="cmt">#   - Detects LSASS access (Mimikatz)</span>
<span class="cmt"># Event 11: File create</span>
<span class="cmt">#   - Dropped executables or scripts</span>
<span class="cmt"># Event 13: Registry value set</span>
<span class="cmt">#   - Registry persistence detection</span>
<span class="cmt"># Event 15: FileCreateStreamHash</span>
<span class="cmt">#   - Alternate Data Stream detection</span></div>

<div class="ib">Sysmon's <span class="cmd">CreateRemoteThread</span> detection (Event 8) is one of the most effective detections for process injection. It logs the source and target process IDs, the thread entry point, and the start address. If the start address is in a non-image region (e.g., allocated memory), it is a clear indicator of injection. Direct syscall thread creation may bypass Sysmon's user-mode hooks but will not bypass the kernel-mode callbacks.</div>

<h3>Log Evasion Considerations</h3>
<p>While completely avoiding all logging is difficult, several techniques can reduce the forensic footprint:
<span class="cmd">(1)</span> Patching ETW providers to disable specific event sources (detected by integrity checks),
<span class="cmd">(2)</span> Using <span class="cmd">WEVTIL</span> to clear or modify logs (requires admin, generates its own event),
<span class="cmd">(3)</span> Disabling the Windows Event Log service (obvious and generates alerts),
<span class="cmd">(4)</span> Exploiting log size limits to overwrite evidence (slow and unreliable),
<span class="cmd">(5)</span> Using <span class="cmd">Enable-Privelege</span> to manipulate audit policies (detected by 4719),
<span class="cmd">(6)</span> Redirecting ETW events to an inaccessible alternate consumer.</p>

<div class="lb"><strong>Lab:</strong> Enable Advanced Audit Policy on a test Windows system. Use <span class="cmd">secpol.msc</span> to enable "Audit Process Creation" with command-line auditing. Then perform a series of actions (logon, run cmd.exe, create a scheduled task, modify the registry) and use <span class="cmd">Get-WinEvent -LogName Security</span> to find the corresponding event IDs. Create a filter that shows only events for your actions. Then install Sysmon with a default configuration and observe the additional events generated (especially Event 1 vs 4688 differences).</div>

<div class="wb">Security Information and Event Management (SIEM) systems aggregate logs from multiple sources: Windows Event Log, Sysmon, network logs, and endpoint telemetry. Understanding what events a SIEM correlates is essential for operational security. For example, a SIEM might correlate a service creation event (7045) followed by a network connection from that service (5156) as a C2 indicator. Breaking these chains by using trusted processes or encrypted traffic reduces detection.</div>

<div class="mm">Mental Model: Event logs are the security camera footage of the Windows world. Every action leaves a trace. Event ID 4688 is a camera pointing at the front door (process creation). AMSI scanning is a guard patting down scripts before they enter. Sysmon Event 8 is a motion sensor on every window (process injection). You can't disable the cameras without someone noticing, but you can wear disguises, use the right doors, and avoid triggering motion sensors.</div>

<div class="cl-item">Explain how SIEM correlation chains can detect multi-stage attacks</div>
<div class="cl-item">Query the Windows Event Log using PowerShell to find specific security events</div>
`
}
];

function buildPage() {
const nav = document.getElementById('sidebarNav');
const area = document.getElementById('contentArea');

modules.forEach((mod, idx) => {
const li = document.createElement('li');
const a = document.createElement('a');
a.href = '#' + mod.id;
a.innerHTML = `<span class="nav-num">${String(idx+1).padStart(2,'0')}</span><span class="nav-label">${mod.title}</span><span class="nav-dot" data-module="${mod.id}"></span>`;
a.addEventListener('click', (e) => {
document.querySelectorAll('.sidebar-nav a').forEach(el => el.classList.remove('active'));
a.classList.add('active');
});
li.appendChild(a);
nav.appendChild(li);

const card = document.createElement('div');
card.className = 'module-card';
card.id = mod.id;
card.innerHTML = `
<div class="module-header">
<div><span class="module-title">${mod.title}</span><span class="module-tag">${mod.tag}</span></div>
<div style="display:flex;align-items:center;gap:10px;">
<span class="module-count">${mod.count} items</span>
<span class="module-chevron">&#9654;</span>
</div>
</div>
<div class="module-body">${mod.content}</div>
`;
area.appendChild(card);
});

document.querySelectorAll('.module-header').forEach(header => {
header.addEventListener('click', function() {
const card = this.parentElement;
const isOpen = card.classList.contains('open');
card.classList.toggle('open');
const mid = card.id;
if (card.classList.contains('open')) {
localStorage.setItem('modopen_' + mid, '1');
} else {
localStorage.removeItem('modopen_' + mid);
}
updateProgress();
});
});

document.querySelectorAll('.cl-item').forEach(item => {
item.addEventListener('click', function() {
this.classList.toggle('done');
const items = this.closest('.module-body').querySelectorAll('.cl-item');
const mid = this.closest('.module-card').id;
const done = [];
items.forEach((it, i) => { if (it.classList.contains('done')) done.push(i); });
localStorage.setItem('checklist_' + mid, JSON.stringify(done));
updateProgress();
});
});

modules.forEach(mod => {
const saved = localStorage.getItem('modopen_' + mod.id);
if (saved === '1') {
const card = document.getElementById(mod.id);
if (card) card.classList.add('open');
}
const checkItems = document.getElementById(mod.id)?.querySelectorAll('.cl-item');
if (checkItems) {
const savedState = localStorage.getItem('checklist_' + mod.id);
if (savedState) {
try {
const done = JSON.parse(savedState);
done.forEach(idx => { if (checkItems[idx]) checkItems[idx].classList.add('done'); });
} catch(e) {}
}
}
});

updateProgress();
}

function updateProgress() {
let total = 0, done = 0;
document.querySelectorAll('.module-card').forEach(card => {
const items = card.querySelectorAll('.cl-item');
const mid = card.id;
items.forEach(item => {
total++;
if (item.classList.contains('done')) done++;
});
const dot = document.querySelector(`.nav-dot[data-module="${mid}"]`);
if (dot) {
const allDone = items.length > 0 && Array.from(items).every(i => i.classList.contains('done'));
dot.classList.toggle('done', allDone);
}
});
const pct = total > 0 ? Math.round((done / total) * 100) : 0;
document.getElementById('progressText').textContent = `${done}/${total}`;
document.getElementById('progressFill').style.width = pct + '%';
}

document.addEventListener('DOMContentLoaded', () => {
buildPage();
document.querySelectorAll('.sidebar-nav a').forEach(a => {
a.addEventListener('click', function(e) {
e.preventDefault();
const target = document.querySelector(this.getAttribute('href'));
if (target) {
target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
});
});
});
</script>
</body>
</html>
